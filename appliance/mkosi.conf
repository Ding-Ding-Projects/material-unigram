# Material Unigram appliance: a minimal Debian image that boots straight into the Telegram proxy
# (or the full server, with ImageVersion variant "full"). Built by appliance/build.ps1.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=material-unigram-appliance
ImageVersion=0.1.0
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=console=ttyS0 console=tty0 quiet
Hostname=material-unigram
Packages=
        linux-image-amd64
        systemd
        systemd-sysv
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        dbus
        udev
        iproute2
        iputils-ping
        ca-certificates
        curl
        docker.io
        docker-compose
        unattended-upgrades
        openssl
RemoveFiles=/usr/share/doc /usr/share/man
