# Material Unigram full server: Teamgram (an unofficial, open-source Telegram-compatible
# server) with its dependencies and the dashboard. A private network of its own: accounts made
# here cannot talk to people on Telegram.
#
# Start: host.bat --full, or: docker compose -f server/full/compose.yaml --env-file server/full/.env up -d
# Only the client gateway ports and the dashboard are published; databases stay internal.
name: material-unigram-fullserver

x-commit: &teamgram-commit
  TEAMGRAM_COMMIT: 8adf26bc071159c12a62c22ad49625a73e922e79

services:
  keys:
    # One-shot: makes this install's own server key before Teamgram starts.
    build: { context: .., dockerfile: full/dashboard.Dockerfile }
    image: ghcr.io/ding-ding-projects/material-unigram-fullserver-dashboard:${IMAGE_TAG:-0.1.0}
    command: ["node", "/opt/dashboard/rsakey.js", "/keys"]
    volumes: [keys:/keys]
    restart: "no"

  mysql:
    build: { context: ., dockerfile: mysql.Dockerfile, args: *teamgram-commit }
    image: ghcr.io/ding-ding-projects/material-unigram-fullserver-mysql:${IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in server/full/.env}
      MYSQL_DATABASE: teamgram
      MYSQL_USER: teamgram
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in server/full/.env}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-authentication-plugin=mysql_native_password]
    volumes: [mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redis:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 5 }

  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    restart: unless-stopped
    environment:
      ETCD_NAME: node1
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: node1=http://etcd:2380
      ETCD_INITIAL_CLUSTER_TOKEN: material-unigram-etcd
      ETCD_INITIAL_CLUSTER_STATE: new
    volumes: [etcd:/etcd-data]

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka:/var/lib/kafka/data]

  minio:
    # S3-compatible file storage. SeaweedFS stands in for MinIO, whose images are no longer
    # publicly published; it keeps the name and port Teamgram's configuration expects.
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in server/full/.env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in server/full/.env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"teamgram","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip=minio -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=9000 -s3.config=/tmp/s3.json
    volumes: [minio:/data]

  minio-init:
    image: chrislusf/seaweedfs:4.51
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until echo "s3.bucket.list" | weed shell -master=minio:9333 >/dev/null 2>&1; do sleep 2; done
        for bucket in documents encryptedfiles photos videos; do echo "s3.bucket.create -name $$bucket" | weed shell -master=minio:9333; done
        echo "s3.bucket.list" | weed shell -master=minio:9333

  teamgram:
    build: { context: ., dockerfile: teamgram.Dockerfile, args: *teamgram-commit }
    image: ghcr.io/ding-ding-projects/material-unigram-fullserver:${IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      keys: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd: { condition: service_started }
      kafka: { condition: service_started }
      minio-init: { condition: service_completed_successfully }
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: [keys:/keys:ro]
    ports:
      - "${GATEWAY_PORT:-10443}:10443"
      - "${WEBSOCKET_PORT:-11443}:11443"

  dashboard:
    build: { context: .., dockerfile: full/dashboard.Dockerfile }
    image: ghcr.io/ding-ding-projects/material-unigram-fullserver-dashboard:${IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      keys: { condition: service_completed_successfully }
    environment:
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in server/full/.env}
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      GATEWAY_PORT: ${GATEWAY_PORT:-10443}
      <<: *teamgram-commit
    volumes: [keys:/keys]
    ports:
      - "${DASHBOARD_HOST_PORT:-8081}:8080"

volumes:
  keys:
  mysql:
  redis:
  etcd:
  kafka:
  minio:
