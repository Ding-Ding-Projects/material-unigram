<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Material Unigram proxy</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<script src="/login.js" defer></script>
</head>
<body class="app center">
<main class="sheet login">
  <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v6c0 4 3.5 7 8 8 4.5-1 8-4 8-8V7z"/></svg></span>
  <h1 class="disp">Proxy dashboard</h1>
  <p class="mute">Enter the dashboard password you chose when setting up the proxy.</p>
  <form id="form" class="field">
    <label for="password"><b>Password</b></label>
    <input id="password" type="password" autocomplete="current-password" required minlength="8">
    <button class="btn" type="submit">Sign in</button>
  </form>
  <p id="error" class="error" role="alert"></p>
</main>
</body>
</html>
