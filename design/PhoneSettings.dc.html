<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings and appearance sheet on a narrow screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+HK:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #fff">
  <header style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <div class="hbar"><a href="Phone.dc.html" class="icon-btn" aria-label="Back" style="width: 48px; height: 48px">&#8592;</a><b class="disp" style="font-size: 26px; flex: 1">Settings</b></div>
    <div style="display: flex; gap: 8px"><label class="search" style="flex: 1"><span class="sr">Search settings</span><input placeholder="Search every setting"></label><button class="rx" aria-label="Regex builder for settings search">.*</button></div>
  </header>
  <div style="padding: 0 16px">
    <div class="set"><div class="t"><b>Language</b></div><div class="seg"><button style="padding: 0 10px">EN</button><button style="padding: 0 10px">粵</button><button class="on" style="padding: 0 10px">Both</button></div></div>
    <div class="set"><div class="t"><b>Edit look</b><span class="small mute">Long-press anything to restyle it</span></div><button class="sw on" role="switch" aria-checked="true" aria-label="Edit look"></button></div>
    <div class="set"><div class="t"><b>Action sounds</b></div><button class="sw on" role="switch" aria-checked="true" aria-label="Action sounds"></button></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <section role="dialog" aria-label="Edit appearance of Setting row" style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 18px 24px; display: flex; flex-direction: column; gap: 12px; border-top: 3px solid var(--violet)">
    <span style="width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center"></span>
    <div class="hbar"><b class="disp" style="font-size: 20px; flex: 1">Edit appearance</b><span class="tag vio">Setting row</span></div>
    <div class="hbar" style="gap: 10px"><span style="width: 44px; height: 44px; border-radius: 14px; background: #d3f1e7; border: 3px solid var(--ink)"></span><span style="width: 44px; height: 44px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line)"></span><span style="width: 44px; height: 44px; border-radius: 14px; background: #e8f6a8"></span><span style="width: 44px; height: 44px; border-radius: 14px; background: #e3dcff"></span><button class="btn sm ghost">Any</button></div>
    <label class="field small"><b>Corners · 16 px</b><input type="range" class="range" min="0" max="32" value="16"></label>
    <label class="field small"><b>Text size · 15 px</b><input type="range" class="range" min="12" max="24" value="15"></label>
    <div class="hbar small"><span class="chip on">Only this one</span><span class="chip">All like it</span></div>
    <div class="hbar"><button class="btn ghost" style="flex: 1; justify-content: center">Reset</button><button class="btn" style="flex: 1; justify-content: center">Done</button></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
