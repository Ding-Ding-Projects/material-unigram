<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat list on a narrow screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #fff; overflow: hidden">
  <header style="background: var(--ink); color: #fff; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px">
    <div class="hbar"><span class="logo" style="width: 32px; height: 32px; border-radius: 10px; margin: 0" aria-hidden="true"></span><b class="disp" style="font-size: 22px; flex: 1">Chats</b><span class="small" style="color: var(--ink-mute)">v0.1.0 · 12:40</span><button class="icon-btn" aria-label="More: language, Edit look, notifications, palette" style="color: #fff; width: 48px; height: 48px">&#8942;</button></div>
    <div class="hbar" style="gap: 6px; overflow: hidden"><span class="chip" style="background: #fff; color: var(--ink); border-color: #fff">Personal</span><span class="chip" style="color: var(--ink-mute); border-color: rgba(255,255,255,.25)">Work</span><span class="chip" style="color: #fff; border-color: rgba(255,255,255,.25)" aria-label="New tab">+</span></div>
    <div style="display: flex; gap: 8px"><label class="hbar" style="flex: 1; background: rgba(255,255,255,.1); border-radius: 14px; height: 48px; padding: 0 12px"><span class="sr">Search chats</span><input placeholder="Search chats" style="border: 0; background: transparent; color: #fff; font: inherit; outline: none; flex: 1; min-width: 0"></label><button class="rx" aria-label="Regex builder for chat search" style="background: var(--violet); color: #fff">.*</button></div>
  </header>
  <div class="hbar" style="gap: 6px; padding: 10px 12px; overflow-x: auto"><button class="chip on">All</button><button class="chip">Unread 4</button><button class="chip">Groups</button><button class="chip">More</button></div>
  <div style="flex: 1; padding: 0 6px; display: flex; flex-direction: column; gap: 2px; overflow: hidden">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
      <div class="row" style="min-height: 64px"><span class="av" style="{{c.av}}">{{c.ini}}</span><span style="flex: 1; min-width: 0"><span class="hbar" style="gap: 6px"><b style="flex: 1">{{c.name}}</b><span class="small mute">{{c.time}}</span></span><span class="mute" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span></span></div>
    </sc-for>
  </div>
  <nav aria-label="Sections" class="hbar" style="background: var(--ink); padding: 10px 6px 18px; gap: 0">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; font-size: 12px; color: #93a6b7"><span style="{{t.pill}}">{{t.ini}}</span>{{t.label}}</a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pastel = ['#c9d7ff', '#bfeedd', '#ffd5c8', '#e8f6a8', '#e3dcff', '#ffe7a8'];
    const chats = [['Saved messages', 'SM', '09:12', 'Boarding pass.pdf'], ['Design team', 'DT', '10:41', 'Ada: The new boards are up'], ['Hiking club', 'HC', 'Tue', 'Sunday 8:00 at the trailhead'], ['Release channel', 'RC', 'Mon', 'Version 0.1.0 is out'], ['Family', 'FA', 'Sun', 'Dinner at 7?'], ['Book club', 'BC', 'Sat', 'Chapter 6 for next week']]
      .map((c, i) => ({ name: c[0], ini: c[1], time: c[2], preview: c[3], av: `width: 48px; height: 48px; background: ${pastel[i]}` }));
    const tabs = [['Chats', 'C', 1], ['Contacts', 'P', 0], ['Tools', 'T', 0], ['Settings', 'S', 0]].map(t => ({ label: t[0], ini: t[1],
      pill: `width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; background: ${t[2] ? '#d4f36b' : 'transparent'}; color: ${t[2] ? '#0f1a24' : '#93a6b7'}` }));
    return { chats, tabs };
  }
}
</script>
</body>
</html>
