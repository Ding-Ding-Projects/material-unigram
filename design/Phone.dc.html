<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat list on a narrow screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&amp;family=Roboto+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f6f9fb; color: #171c1f; font-family: 'Roboto Flex', system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 8px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 600; flex: 1">Chats</h1>
    <button aria-label="Regex builder for chat search" style="border: 0; background: #cfe6f1; color: #08485a; width: 48px; height: 48px; border-radius: 24px; font-family: 'Roboto Mono', monospace">.*</button>
    <button aria-label="More actions" style="border: 0; background: transparent; width: 48px; height: 48px; border-radius: 24px; color: #41484d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </header>
  <label style="margin: 0 16px 12px; display: flex; align-items: center; gap: 8px; background: #e3e9ed; border-radius: 28px; padding: 0 16px; height: 48px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#41484d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span style="position: absolute; left: -9999px">Search chats</span>
    <input placeholder="Search chats" style="border: 0; background: transparent; flex: 1; font: inherit; outline: none">
  </label>
  <div style="display: flex; gap: 8px; padding: 0 16px 8px; overflow-x: auto">
    <button style="border: 0; background: #cfe6f1; color: #08485a; border-radius: 8px; padding: 0 14px; height: 36px; white-space: nowrap">All</button>
    <button style="border: 1px solid #c1c8cd; background: transparent; border-radius: 8px; padding: 0 14px; height: 36px; white-space: nowrap">Unread 4</button>
    <button style="border: 1px solid #c1c8cd; background: transparent; border-radius: 8px; padding: 0 14px; height: 36px; white-space: nowrap">Groups</button>
    <button style="border: 1px solid #c1c8cd; background: transparent; border-radius: 8px; padding: 0 14px; height: 36px; white-space: nowrap">Channels</button>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; padding: 0 8px; gap: 2px; overflow: hidden">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
      <button style="display: flex; align-items: center; gap: 12px; padding: 10px 8px; border: 0; background: transparent; border-radius: 16px; width: 100%; color: inherit; min-height: 64px">
        <span style="{{c.avatar}}">{{c.initials}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left">
          <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{c.name}}</span><span style="font-size: 12px; color: #41484d">{{c.time}}</span></span>
          <span style="color: #41484d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span>
        </span>
      </button>
    </sc-for>
  </div>
  <button aria-label="New message" style="position: relative; align-self: flex-end; margin: 0 16px 16px; border: 0; background: #cfe6f1; color: #08485a; width: 56px; height: 56px; border-radius: 16px">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>
  <nav aria-label="Sections" style="display: flex; background: #e9eef2; padding: 12px 0 16px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #41484d; font-size: 12px">
        <span style="{{t.pill}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = ['#5b5f97', '#0b6780', '#8f4c38', '#2e6b30', '#7a5390', '#6b5d00'];
    const chats = [
      ['Saved messages', 'SM', '09:12', 'Boarding pass.pdf'], ['Design team', 'DT', '10:41', 'Ada: New board is up'],
      ['Hiking club', 'HC', 'Tue', 'Sunday 8:00 at the trailhead'], ['Release channel', 'RC', 'Mon', 'Version 0.1.0 is out'],
      ['Family', 'FA', 'Sun', 'Dinner at 7?'], ['Book club', 'BC', 'Sat', 'Chapter 6 for next week']
    ].map((c, i) => ({ name: c[0], initials: c[1], time: c[2], preview: c[3],
      avatar: `width: 48px; height: 48px; border-radius: 24px; background: ${colors[i]}; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; flex: 0 0 auto` }));
    const tabs = [
      { label: 'Chats', icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', on: true },
      { label: 'Contacts', icon: 'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
      { label: 'Tools', icon: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z' },
      { label: 'More', icon: 'M3 12h18M3 6h18M3 18h18' }
    ].map(t => ({ ...t, pill: `width: 64px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ${t.on ? '#cfe6f1' : 'transparent'}; color: ${t.on ? '#08485a' : '#41484d'}` }));
    return { chats, tabs };
  }
}
</script>
</body>
</html>
