<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat workspace</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+HK:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 100%; position: relative; background: #e7ecf2">
<div class="app" style="min-height: 900px; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 10px 10px 0">

  <nav class="rail" aria-label="Sections" style="flex: 0 0 84px; border-radius: 0 24px 24px 0">
    <span class="logo" role="img" aria-label="Material Unigram"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/><path d="M9 10.5h.01M15 10.5h.01" stroke-linecap="round"/></svg></span>
    <a href="#" class="on"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Chats</a>
    <a href="Contacts.dc.html"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>Contacts</a>
    <a href="Calls.dc.html"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>Calls</a>
    <a href="Converter.dc.html"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>Tools</a>
    <span style="flex: 1"></span>
    <a href="Settings.dc.html"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span>Settings</a>
  </nav>

  <div style="flex: 1 1 900px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
    <!-- top bar: account tabs, provenance, palette -->
    <header class="hbar" style="flex-wrap: wrap; padding: 4px 4px 0">
      <nav aria-label="Workspace tabs" style="display: flex; gap: 6px; flex: 1 1 420px; min-width: 0; overflow-x: auto">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button onClick="{{t.pick}}" class="{{t.cls}}"><span class="av" style="{{t.dot}}">{{t.ini}}</span>{{t.label}}</button>
        </sc-for>
        <a href="NewTab.dc.html" class="chip" aria-label="New tab" style="width: 34px; padding: 0; justify-content: center; text-decoration: none">+</a>
      </nav>
      <span class="seg" role="radiogroup" aria-label="Language" style="background: #fff"><button style="height: 34px; padding: 0 10px">EN</button><button style="height: 34px; padding: 0 10px">粵</button><button class="on" style="height: 34px; padding: 0 10px">Both</button></span>
      <button class="chip" role="switch" aria-checked="true" style="background: var(--lime); border-color: var(--lime); color: var(--ink)">Edit look</button>
      <span class="small mute" title="Version and last update">v0.1.0 · updated 17 Nov 2026, 12:40</span>
      <a href="Palette.dc.html" class="chip" style="text-decoration: none; background: #fff">Search everything <span class="kbd">Ctrl Shift F</span></a>
      <a href="Notifications.dc.html" class="icon-btn" aria-label="Notification centre, 2 new" style="background: #fff; position: relative"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge" style="position: absolute; top: -4px; right: -4px">2</span></a>
    </header>

    <div style="display: flex; flex-wrap: wrap; gap: 10px; flex: 1 1 auto; min-height: 0">
      <!-- chat list sheet -->
      <section class="sheet" aria-label="Chat list" style="flex: 1 1 340px; max-width: 400px; min-width: 300px; display: flex; flex-direction: column; padding: 18px 10px 10px">
        <div class="hbar" style="padding: 0 8px 12px">
          <h1 class="disp" style="margin: 0; font-size: 30px; flex: 1">Chats</h1>
          <button class="btn sm" aria-label="New message"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New</button>
        </div>
        <div style="display: flex; gap: 8px; padding: 0 8px">
          <label class="search" style="flex: 1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a5a68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search chats</span><input placeholder="Search chats and messages"></label>
          <a href="Workbench.dc.html" class="rx" aria-label="Regex builder for chat search" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none">.*</a>
        </div>
        <div role="tablist" aria-label="Folders" style="display: flex; gap: 6px; padding: 12px 8px; overflow-x: auto">
          <sc-for list="{{folders}}" as="f" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" class="{{f.cls}}">{{f.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
            <button onClick="{{c.pick}}" class="{{c.cls}}">
              <span class="av" style="{{c.av}}">{{c.ini}}</span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="display: flex; gap: 8px"><b style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</b><span class="small mute">{{c.time}}</span></span>
                <span style="display: flex; gap: 8px; align-items: center"><span class="mute" style="flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span><sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{false}}"><span class="badge">{{c.unread}}</span></sc-if></span>
              </span>
            </button>
          </sc-for>
        </div>
      </section>

      <!-- conversation sheet -->
      <main class="sheet" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
        <div class="hbar" style="padding: 14px 18px">
          <span class="av" style="{{active.av}}">{{active.ini}}</span>
          <a href="ChatInfo.dc.html" style="flex: 1; min-width: 0; text-decoration: none; color: inherit">
            <div class="disp" style="font-size: 20px; font-weight: 700">{{active.name}}</div>
            <div class="small mute">{{active.status}}</div>
          </a>
          <button class="icon-btn" aria-label="Search in this chat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
          <button class="icon-btn" aria-label="Start a call"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></button>
          <a href="ChatInfo.dc.html" class="icon-btn" aria-label="Chat details"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></a>
        </div>
        <div class="wall" style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; margin: 0 10px; border-radius: 20px">
          <span class="tag" style="align-self: center; background: rgba(255,255,255,.8); color: var(--mute)">Today</span>
          <sc-for list="{{active.messages}}" as="m" hint-placeholder-count="4">
            <div style="{{m.wrap}}"><div class="{{m.cls}}">{{m.text}}<span class="ts">{{m.time}}</span></div></div>
          </sc-for>
        </div>
        <div class="hbar" style="padding: 12px 18px 16px; align-items: flex-end">
          <button class="icon-btn" aria-label="Attach a file" style="background: var(--sheet2); width: 48px; height: 48px; border-radius: 16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <label class="search" style="flex: 1; height: 52px; background: #fff"><span class="sr">Message</span><input placeholder="Write a message"><span class="small mute">Shift Enter for a new line</span></label>
          <button class="btn" aria-label="Send" style="width: 52px; height: 52px; padding: 0; justify-content: center; border-radius: 18px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </main>
    </div>
  </div>
</div>
<div style="position: absolute; left: 300px; top: 250px; z-index: 5"><dc-import name="ElementTools" target="Chat list row: Design team" hint-size="640px,470px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { chat: 1, tab: 0, folder: 0 }; }
  renderVals() {
    const pastel = ['#c9d7ff', '#bfeedd', '#ffd5c8', '#e8f6a8', '#e3dcff', '#ffe7a8'];
    const sq = (i, s) => `width: ${s}px; height: ${s}px; background: ${pastel[i % 6]}; font-size: ${s > 44 ? 16 : 13}px; border-radius: ${Math.round(s * .32)}px`;
    const data = [
      { name: 'Saved messages', ini: 'SM', time: '09:12', preview: 'Boarding pass.pdf', unread: 0, status: 'Notes to self', messages: [{ me: true, text: 'Boarding pass for Friday', time: '09:12' }] },
      { name: 'Design team', ini: 'DT', time: '10:41', preview: 'Ada: The new boards are up', unread: 3, status: '8 members · 3 online', messages: [
        { me: false, text: 'The new boards are up on the canvas.', time: '10:32' },
        { me: false, text: 'Every search has its regex builder right beside it now.', time: '10:33' },
        { me: true, text: 'Does the narrow layout keep every control?', time: '10:40' },
        { me: false, text: 'Yes. Extra pills fold into More at 360 px.', time: '10:41' }] },
      { name: 'Hiking club', ini: 'HC', time: 'Tue', preview: 'Sunday 8:00 at the trailhead', unread: 1, status: '24 members', messages: [{ me: false, text: 'Sunday 8:00 at the trailhead.', time: 'Tue' }] },
      { name: 'Release channel', ini: 'RC', time: 'Mon', preview: 'Version 0.1.0 is out', unread: 0, status: '1,204 subscribers', messages: [{ me: false, text: 'Version 0.1.0 is out.', time: 'Mon' }] },
      { name: 'Family', ini: 'FA', time: 'Sun', preview: 'Dinner at 7?', unread: 0, status: '5 members', messages: [{ me: false, text: 'Dinner at 7?', time: 'Sun' }] },
      { name: 'Book club', ini: 'BC', time: 'Sat', preview: 'Chapter 6 for next week', unread: 0, status: '11 members', messages: [{ me: false, text: 'Chapter 6 for next week.', time: 'Sat' }] }
    ];
    const chats = data.map((c, i) => ({ ...c, hasUnread: c.unread > 0, av: sq(i, 48), cls: this.state.chat === i ? 'row on' : 'row', pick: () => this.setState({ chat: i }) }));
    const a = data[this.state.chat];
    const active = { ...a, av: sq(this.state.chat, 44), messages: a.messages.map(m => ({ ...m, cls: m.me ? 'bout' : 'bin', wrap: `display: flex; justify-content: ${m.me ? 'flex-end' : 'flex-start'}` })) };
    const tabs = [['Personal', 'P', 0], ['Work', 'W', 2], ['Release channel', 'R', 3]].map((t, i) => ({ label: t[0], ini: t[1], dot: sq(t[2], 22) + '; font-size: 11px', cls: this.state.tab === i ? 'chip on' : 'chip', pick: () => this.setState({ tab: i }) }));
    const folders = ['All', 'Unread 4', 'Groups', 'Channels', 'Bots'].map((label, i) => ({ label, on: this.state.folder === i, cls: this.state.folder === i ? 'chip on' : 'chip', pick: () => this.setState({ folder: i }) }));
    return { chats, active, tabs, folders };
  }
}
</script>
</body>
</html>
