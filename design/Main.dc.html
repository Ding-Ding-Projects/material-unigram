<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat workspace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&amp;family=Noto+Sans+HK:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0b6780}a:hover{color:#08485a}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-direction: column; background: #f6f9fb; color: #171c1f; font-family: 'Roboto Flex', 'Noto Sans HK', system-ui, sans-serif; font-size: 14px">

  <!-- Title bar with workspace tabs -->
  <header style="display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #e9eef2; flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 8px; padding-right: 8px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0b6780" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 7 3-5 5 4z"/></svg>
      <span style="font-weight: 600; font-size: 15px">Material Unigram</span>
      <span style="font-size: 11px; color: #41484d; background: #dbe4ea; border-radius: 8px; padding: 2px 8px">v0.1.0 · updated 2026-11-17</span>
    </div>
    <nav aria-label="Workspace tabs" style="display: flex; gap: 4px; flex: 1 1 360px; min-width: 0; overflow-x: auto">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
      <button aria-label="New tab" style="border: 0; background: transparent; width: 36px; height: 36px; border-radius: 18px; cursor: pointer; color: #41484d">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
    <div style="display: flex; align-items: center; gap: 4px">
      <button aria-label="Command palette" style="border: 0; background: #dbe4ea; border-radius: 16px; padding: 6px 12px; cursor: pointer; color: #41484d">Ctrl K</button>
      <button aria-label="Notifications" style="border: 0; background: transparent; width: 40px; height: 40px; border-radius: 20px; cursor: pointer; color: #41484d">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      </button>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex: 1 1 auto; min-height: 0">

    <!-- Navigation rail -->
    <nav aria-label="Sections" style="flex: 0 0 80px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; background: #eef3f6">
      <sc-for list="{{rail}}" as="r" hint-placeholder-count="5">
        <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #41484d; font-size: 12px; width: 64px">
          <span style="{{r.pill}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
          </span>
          <span>{{r.label}}</span>
        </a>
      </sc-for>
    </nav>

    <!-- Chat list -->
    <section aria-label="Chat list" style="flex: 1 1 340px; max-width: 400px; min-width: 280px; display: flex; flex-direction: column; background: #f6f9fb; border-right: 1px solid #dbe4ea">
      <div style="padding: 16px 16px 8px; display: flex; gap: 8px">
        <label style="flex: 1; display: flex; align-items: center; gap: 8px; background: #e3e9ed; border-radius: 28px; padding: 0 16px; height: 48px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#41484d" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span style="position: absolute; left: -9999px">Search chats</span>
          <input placeholder="Search chats and messages" style="border: 0; background: transparent; flex: 1; font: inherit; outline: none; color: #171c1f">
        </label>
        <button aria-label="Open regex builder for chat search" style="border: 0; background: #cfe6f1; color: #08485a; border-radius: 24px; width: 48px; height: 48px; cursor: pointer; font-family: 'Roboto Mono', monospace; font-weight: 600">.*</button>
      </div>
      <div role="tablist" aria-label="Folders" style="display: flex; gap: 8px; padding: 4px 16px 12px; flex-wrap: wrap">
        <button style="border: 0; background: #cfe6f1; color: #08485a; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-weight: 500">All</button>
        <button style="border: 1px solid #c1c8cd; background: transparent; color: #41484d; border-radius: 8px; padding: 6px 14px; cursor: pointer">Unread 4</button>
        <button style="border: 1px solid #c1c8cd; background: transparent; color: #41484d; border-radius: 8px; padding: 6px 14px; cursor: pointer">Groups</button>
        <button style="border: 1px solid #c1c8cd; background: transparent; color: #41484d; border-radius: 8px; padding: 6px 14px; cursor: pointer">Channels</button>
      </div>
      <div style="display: flex; flex-direction: column; padding: 0 8px; gap: 2px">
        <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" style="{{c.row}}">
            <span style="{{c.avatar}}">{{c.initials}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left">
              <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span><span style="font-size: 12px; color: #41484d">{{c.time}}</span></span>
              <span style="display: flex; justify-content: space-between; gap: 8px"><span style="color: #41484d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span><sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{false}}"><span style="background: #0b6780; color: #fff; border-radius: 10px; min-width: 20px; height: 20px; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px">{{c.unread}}</span></sc-if></span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>

    <!-- Conversation -->
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: #fbfcfd">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid #e3e9ed">
        <span style="{{active.avatar}}">{{active.initials}}</span>
        <div style="flex: 1; min-width: 0">
          <div style="font-weight: 600; font-size: 16px">{{active.name}}</div>
          <div style="font-size: 12px; color: #41484d">{{active.status}}</div>
        </div>
        <button aria-label="Search in chat" style="border: 0; background: transparent; width: 40px; height: 40px; border-radius: 20px; cursor: pointer; color: #41484d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <button aria-label="Voice call" style="border: 0; background: transparent; width: 40px; height: 40px; border-radius: 20px; cursor: pointer; color: #41484d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
        <button aria-label="Chat details" style="border: 0; background: transparent; width: 40px; height: 40px; border-radius: 20px; cursor: pointer; color: #41484d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      </div>
      <div style="flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end">
        <div style="align-self: center; font-size: 12px; color: #41484d; background: #e9eef2; border-radius: 12px; padding: 4px 12px">Today</div>
        <sc-for list="{{active.messages}}" as="m" hint-placeholder-count="4">
          <div style="{{m.wrap}}">
            <div style="{{m.bubble}}">{{m.text}}<span style="display: block; text-align: right; font-size: 11px; opacity: .7; margin-top: 4px">{{m.time}}</span></div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 8px; padding: 12px 24px 20px">
        <button aria-label="Attach file" style="border: 0; background: #e3e9ed; width: 48px; height: 48px; border-radius: 24px; cursor: pointer; color: #41484d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
        <label style="flex: 1; background: #e3e9ed; border-radius: 24px; padding: 12px 20px; min-height: 24px; display: flex">
          <span style="position: absolute; left: -9999px">Message</span>
          <input placeholder="Write a message" style="border: 0; background: transparent; flex: 1; font: inherit; outline: none">
        </label>
        <button aria-label="Send" style="border: 0; background: #0b6780; color: #fff; width: 48px; height: 48px; border-radius: 24px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 7 3-5 5 4z"/></svg></button>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0b6780","options":["#0b6780","#5b5f97","#2e6b30","#8f4c38"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { chat: 1, tab: 0 }; }
  renderVals() {
    const accent = this.props.accent ?? '#0b6780';
    const colors = ['#5b5f97', '#0b6780', '#8f4c38', '#2e6b30', '#7a5390', '#6b5d00'];
    const data = [
      { name: 'Saved messages', initials: 'SM', time: '09:12', preview: 'Boarding pass.pdf', unread: 0, status: 'Notes to self', messages: [{ me: true, text: 'Boarding pass for Friday', time: '09:12' }] },
      { name: 'Design team', initials: 'DT', time: '10:41', preview: 'Ada: New board is up', unread: 3, status: '8 members, 3 online', messages: [
        { me: false, text: 'New settings board is up on the canvas.', time: '10:32' },
        { me: false, text: 'Search now has the regex builder right beside it.', time: '10:33' },
        { me: true, text: 'Nice. Does the narrow layout keep every control?', time: '10:40' },
        { me: false, text: 'Yes, tool pills fold into More at 360 px.', time: '10:41' }] },
      { name: 'Hiking club', initials: 'HC', time: 'Tue', preview: 'Sunday 8:00 at the trailhead', unread: 1, status: '24 members', messages: [{ me: false, text: 'Sunday 8:00 at the trailhead.', time: 'Tue' }] },
      { name: 'Release channel', initials: 'RC', time: 'Mon', preview: 'Version 0.1.0 is out', unread: 0, status: '1,204 subscribers', messages: [{ me: false, text: 'Version 0.1.0 is out.', time: 'Mon' }] },
      { name: 'Family', initials: 'FA', time: 'Sun', preview: 'Dinner at 7?', unread: 0, status: '5 members', messages: [{ me: false, text: 'Dinner at 7?', time: 'Sun' }] },
      { name: 'Book club', initials: 'BC', time: 'Sat', preview: 'Chapter 6 for next week', unread: 0, status: '11 members', messages: [{ me: false, text: 'Chapter 6 for next week.', time: 'Sat' }] }
    ];
    const av = (i, s) => `width: ${s}px; height: ${s}px; border-radius: ${s/2}px; background: ${colors[i % colors.length]}; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: ${s > 44 ? 16 : 14}px; flex: 0 0 auto`;
    const chats = data.map((c, i) => ({ ...c, hasUnread: c.unread > 0, avatar: av(i, 48),
      row: `display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 16px; cursor: pointer; width: 100%; color: inherit; background: ${this.state.chat === i ? '#cfe6f1' : 'transparent'}`,
      pick: () => this.setState({ chat: i }) }));
    const a = data[this.state.chat];
    const active = { ...a, avatar: av(this.state.chat, 40), messages: a.messages.map(m => ({ ...m,
      wrap: `display: flex; justify-content: ${m.me ? 'flex-end' : 'flex-start'}`,
      bubble: `max-width: 60%; padding: 10px 14px; line-height: 1.4; border-radius: ${m.me ? '18px 18px 4px 18px' : '18px 18px 18px 4px'}; background: ${m.me ? accent : '#e9eef2'}; color: ${m.me ? '#fff' : '#171c1f'}` })) };
    const tabNames = ['Personal account', 'Work account', 'Release channel'];
    const tabs = tabNames.map((label, i) => ({ label, pick: () => this.setState({ tab: i }),
      style: `border: 0; border-radius: 18px; padding: 8px 16px; height: 36px; white-space: nowrap; cursor: pointer; background: ${this.state.tab === i ? '#ffffff' : 'transparent'}; color: ${this.state.tab === i ? '#171c1f' : '#41484d'}; font-weight: ${this.state.tab === i ? 600 : 400}` }));
    const rail = [
      { label: 'Chats', icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z', on: true },
      { label: 'Contacts', icon: 'M16 21v-2a4 4 0 0 0-8 0v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z' },
      { label: 'Calls', icon: 'M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3' },
      { label: 'Tools', icon: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-2.5z' },
      { label: 'Settings', icon: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z' }
    ].map(r => ({ ...r, pill: `width: 56px; height: 32px; border-radius: 16px; display: flex; align-items: center; justify-content: center; background: ${r.on ? '#cfe6f1' : 'transparent'}; color: ${r.on ? '#08485a' : '#41484d'}` }));
    return { chats, active, tabs, rail };
  }
}
</script>
</body>
</html>
