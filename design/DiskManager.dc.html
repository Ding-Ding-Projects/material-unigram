<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Virtual disk manager</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; position: relative; background: #e7ecf2">
<dc-import name="TopBar" section="Virtual disks" hint-size="1440px,64px"></dc-import>
<div class="app" style="width: 1440px; height: 900px; padding: 10px; display: flex; gap: 10px">
  <section class="sheet" style="flex: 1; padding: 26px 30px; display: flex; flex-direction: column; gap: 14px">
    <div class="hbar" style="flex-wrap: wrap"><h1 class="disp" style="margin: 0; font-size: 32px; flex: 1">Virtual disks</h1><button class="btn sm">Create disk</button><button class="btn sm tonal">Attach file</button><button class="btn sm ghost">Mount ISO</button></div>
    <div style="display: flex; gap: 8px"><label class="search" style="flex: 1"><span class="sr">Search disks</span><input placeholder="Search by name, path or format"></label><button class="rx" aria-label="Regex builder for disk search">.*</button></div>
    <table style="border-collapse: collapse; width: 100%">
      <thead><tr class="small mute" style="text-align: left"><th style="padding: 8px"><input type="checkbox" aria-label="Select all disks"></th><th>Name</th><th>Format</th><th>Size</th><th>Used</th><th>State</th><th></th></tr></thead>
      <tbody>
        <sc-for list="{{disks}}" as="d" hint-placeholder-count="5">
          <tr style="border-top: 1px solid var(--line)"><td style="padding: 12px 8px"><input type="checkbox" aria-label="Select {{d.name}}"></td><td><b>{{d.name}}</b><div class="small mute mono">{{d.path}}</div></td><td><span class="tag">{{d.fmt}}</span></td><td>{{d.size}}</td><td style="width: 140px"><div style="height: 6px; border-radius: 3px; background: var(--line)"><div style="{{d.bar}}"></div></div></td><td><span class="{{d.stateCls}}">{{d.state}}</span></td><td><button class="btn sm ghost">{{d.action}}</button></td></tr>
        </sc-for>
      </tbody>
    </table>
    <div class="hbar sheet2" style="padding: 12px 16px; margin-top: auto; background: var(--amber-c); color: var(--amber)">Attaching and creating disks need administrator approval. Windows asks you each time.</div>
  </section>
  <aside class="sheet" style="width: 400px; padding: 26px; display: flex; flex-direction: column; gap: 12px">
    <h2 class="disp" style="margin: 0; font-size: 24px">Create a disk</h2>
    <label class="field"><b>Format</b><select><option>VHDX (recommended)</option><option>VHD</option><option>VHD Set</option></select></label>
    <label class="field"><b>Size</b><input value="64 GB"></label>
    <div class="field"><b>Type</b><div class="seg"><button class="on">Grows as needed</button><button>Fixed</button></div></div>
    <label class="field"><b>File system</b><select><option>NTFS</option><option>ReFS</option><option>exFAT</option></select></label>
    <label class="field"><b>Save to</b><input class="mono" value="D:\Disks\backup.vhdx"></label>
    <button class="btn" style="margin-top: auto">Create and attach</button>
  </aside>
</div>
<div style="position: absolute; left: 300px; top: 364px; z-index: 5"><dc-import name="ElementTools" target="Disk row: Backup" hint-size="680px,560px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    const disks = [['Backup', 'D:\\Disks\\backup.vhdx', 'VHDX', '64 GB', 41, 'Attached as F:', 'Detach'], ['Dev tools', 'D:\\Disks\\dev.vhdx', 'VHDX', '128 GB', 72, 'Attached as G:', 'Detach'], ['Old laptop', 'E:\\Archive\\laptop.vhd', 'VHD', '256 GB', 88, 'Not attached', 'Attach'], ['Windows setup', 'C:\\Users\\Public\\win.iso', 'ISO', '5.8 GB', 100, 'Mounted as H:', 'Eject'], ['Shared set', 'D:\\Disks\\team.vhds', 'VHD Set', '32 GB', 12, 'Not attached', 'Attach']]
      .map(d => ({ name: d[0], path: d[1], fmt: d[2], size: d[3], state: d[5], action: d[6], stateCls: d[5].startsWith('Not') ? 'tag' : 'tag ok', bar: `height: 6px; border-radius: 3px; background: ${d[4] > 85 ? '#e2482a' : '#0e7c66'}; width: ${d[4]}%` }));
    return { disks };
  }
}
</script>
</body>
</html>
