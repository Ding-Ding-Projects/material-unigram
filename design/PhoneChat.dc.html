<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation on a narrow screen</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="app" style="width: 390px; height: 844px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #fff">
  <header class="hbar" style="padding: 12px 10px; gap: 8px; background: #fff">
    <a href="Phone.dc.html" class="icon-btn" aria-label="Back" style="width: 48px; height: 48px">&#8592;</a>
    <span class="av" style="width: 40px; height: 40px; background: #bfeedd">DT</span>
    <span style="flex: 1"><b class="disp" style="display: block; font-size: 18px">Design team</b><span class="small mute">8 members</span></span>
    <button class="icon-btn" aria-label="Search in this chat" style="width: 48px; height: 48px">&#9906;</button>
    <button class="icon-btn" aria-label="More" style="width: 48px; height: 48px">&#8942;</button>
  </header>
  <div class="wall" style="flex: 1; padding: 14px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
    <div class="bin" style="max-width: 82%">The new boards are up on the canvas.<span class="ts">10:32</span></div>
    <div class="bin" style="max-width: 82%; outline: 3px solid var(--violet); outline-offset: 2px">Every search has its regex builder beside it now.<span class="ts">10:33</span></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <section role="dialog" aria-label="Message actions" style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 28px 28px 0 0; padding: 10px 14px 22px; display: flex; flex-direction: column; gap: 2px">
    <span style="width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; margin-bottom: 8px"></span>
    <div class="hbar" style="gap: 8px; padding: 4px 4px 10px"><span class="chip">&#128077;</span><span class="chip">&#10084;</span><span class="chip">&#128514;</span><span class="chip">+</span></div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
      <div class="{{it.cls}}" style="min-height: 48px"><span style="flex: 1">{{it.label}}</span><span class="small mute">{{it.hint}}</span></div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [['Reply', ''], ['Copy', ''], ['Open in a new tab', ''], ['Explain this', ''], ['Edit appearance', 'opens a sheet'], ['Lock this', ''], ['Select several', ''], ['Export', '']].map((m, i) => ({ label: m[0], hint: m[1], cls: i === 4 ? 'row on' : 'row' }));
    return { items };
  }
}
</script>
</body>
</html>
