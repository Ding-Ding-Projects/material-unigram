<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notification centre</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; position: relative; background: #e7ecf2">
<dc-import name="TopBar" section="Notifications" hint-size="1440px,64px"></dc-import>
<div class="app wall" style="width: 1440px; height: 900px; position: relative; overflow: hidden">
  <!-- inline progress where the work started -->
  <div class="sheet" style="position: absolute; left: 40px; top: 40px; width: 620px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
    <b class="disp" style="font-size: 20px">Design team · sending 3 photos</b>
    <div class="hbar"><span class="av" style="width: 56px; height: 56px; background: #c9d7ff">1</span><span class="av" style="width: 56px; height: 56px; background: #bfeedd">2</span><span class="av" style="width: 56px; height: 56px; background: #ffd5c8; outline: 2px solid var(--coral); outline-offset: 2px">3</span></div>
    <div class="sheet2" style="padding: 12px 14px; border: 1.5px solid var(--coral); display: flex; flex-direction: column; gap: 8px">
      <b>Photo 3 did not send</b>
      <span class="small">The connection dropped at 74%. Photos 1 and 2 arrived.</span>
      <div class="hbar"><button class="btn sm">Retry photo 3</button><button class="btn sm ghost">Remove it</button></div>
    </div>
  </div>
  <!-- toasts, bottom left, never blocking -->
  <div style="position: absolute; left: 40px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; width: 420px">
    <div role="status" class="hbar" style="background: var(--ink); color: #fff; border-radius: 16px; padding: 14px 16px"><span style="flex: 1">Export finished · 340 MB</span><button class="btn sm" style="background: var(--lime); color: var(--ink)">Open</button></div>
    <div role="status" class="hbar" style="background: var(--ink); color: #fff; border-radius: 16px; padding: 14px 16px"><span style="flex: 1">Chat archived</span><button class="btn sm" style="background: transparent; color: var(--lime)">Undo</button></div>
  </div>
  <!-- centre -->
  <aside class="sheet" aria-label="Notification centre" style="position: absolute; right: 10px; top: 10px; bottom: 10px; width: 460px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgba(15,26,36,.2)">
    <div class="hbar"><h1 class="disp" style="margin: 0; font-size: 28px; flex: 1">Notifications</h1><button class="btn sm ghost">Mark all read</button></div>
    <div class="hbar" style="gap: 6px; flex-wrap: wrap"><button class="chip on">All 7</button><button class="chip">Messages</button><button class="chip">Problems 1</button><button class="chip">Updates</button></div>
    <sc-for list="{{items}}" as="n" hint-placeholder-count="6">
      <div class="{{n.cls}}" style="align-items: flex-start"><span style="{{n.dot}}"></span><span style="flex: 1"><b style="display: block">{{n.title}}</b><span class="small mute">{{n.body}}</span></span><span class="small mute">{{n.when}}</span></div>
    </sc-for>
  </aside>
</div>
<div style="position: absolute; left: 300px; top: 364px; z-index: 5"><dc-import name="ElementTools" target="Notification: Ada mentioned you" hint-size="680px,560px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [['Photo 3 did not send', 'Design team · tap to retry', '12:41', '#e2482a', 1], ['Ada mentioned you', 'Design team: "can you check the boards?"', '12:38', '#0e7c66', 1], ['Export finished', 'Design team · HTML · 340 MB', '12:30', '#5b4fe0', 0], ['Update ready', 'Version 0.1.1 installs when you restart', '11:00', '#5b4fe0', 0], ['Missed call', 'Alex Chan', '11:02', '#e2482a', 0], ['Hiking club', '3 new messages', 'Tue', '#0e7c66', 0]]
      .map(n => ({ title: n[0], body: n[1], when: n[2], cls: n[4] ? 'row on' : 'row', dot: `width: 10px; height: 10px; border-radius: 5px; margin-top: 6px; flex: 0 0 auto; background: ${n[3]}` }));
    return { items };
  }
}
</script>
</body>
</html>
