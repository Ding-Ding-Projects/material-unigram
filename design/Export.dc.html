<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; position: relative; background: #e7ecf2">
<dc-import name="TopBar" section="Export" hint-size="1440px,64px"></dc-import>
<div class="app" style="width: 1440px; height: 900px; padding: 10px; display: flex; gap: 10px">
  <section class="sheet" style="flex: 1; padding: 30px 34px; display: flex; flex-direction: column; gap: 20px">
    <h1 class="disp" style="margin: 0; font-size: 38px">Export</h1>
    <div><b>What</b>
      <div class="hbar" style="flex-wrap: wrap; gap: 6px; margin-top: 8px"><button class="chip on">Design team chat</button><button class="chip">All chats</button><button class="chip">Contacts</button><button class="chip">Settings</button><button class="chip">Search results</button><button class="chip">Call history</button></div></div>
    <div><b>Format</b>
      <div class="grid4" style="margin-top: 8px">
        <sc-for list="{{formats}}" as="f" hint-placeholder-count="8">
          <button class="{{f.cls}}" style="flex-direction: column; align-items: flex-start; gap: 2px; border: 1.5px solid var(--line)"><b>{{f.name}}</b><span class="small mute">{{f.note}}</span></button>
        </sc-for>
      </div></div>
    <div class="grid2">
      <label class="field"><b>Date range</b><select><option>Everything</option><option>Last 30 days</option><option>Custom</option></select></label>
      <label class="field"><b>Media</b><select><option>Include photos and files</option><option>Text only</option></select></label>
    </div>
    <div class="hbar" style="margin-top: auto"><span class="mute" style="flex: 1">About 340 MB · saved to Downloads\Material Unigram</span><button class="btn">Export</button></div>
  </section>
  <aside class="sheet" style="width: 440px; padding: 30px; display: flex; flex-direction: column; gap: 16px">
    <h2 class="disp" style="margin: 0; font-size: 24px">In progress</h2>
    <div class="sheet2" style="padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <div class="hbar"><b style="flex: 1">Design team · HTML</b><span class="tag ok">62%</span></div>
      <div style="height: 8px; border-radius: 4px; background: var(--line)"><div style="width: 62%; height: 8px; border-radius: 4px; background: var(--emerald)"></div></div>
      <span class="small mute">Messages 796 of 1,284 · about 40 seconds left</span>
      <div class="hbar"><button class="btn sm ghost">Pause</button><button class="btn sm ghost">Cancel</button></div>
    </div>
    <div class="sheet2" style="padding: 18px; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid var(--coral)">
      <div class="hbar"><b style="flex: 1">All chats · JSON</b><span class="tag hot">Stopped at 80%</span></div>
      <span class="small">The disk ran out of space while writing photos. Everything up to chat 41 is saved.</span>
      <div class="hbar"><button class="btn sm">Resume from chat 41</button><button class="btn sm ghost">Choose another folder</button></div>
    </div>
    <div class="sheet2" style="padding: 18px; display: flex; flex-direction: column; gap: 6px">
      <div class="hbar"><b style="flex: 1">Settings · JSON</b><span class="tag ok">Done</span></div>
      <a href="#" class="small">Open folder</a>
    </div>
  </aside>
</div>
<div style="position: absolute; left: 300px; top: 444px; z-index: 5"><dc-import name="ElementTools" target="Format: PDF" hint-size="640px,470px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    const formats = [['HTML', 'Readable in any browser', 1], ['JSON', 'Full data, for tools', 0], ['Markdown', 'Plain text with formatting', 0], ['PDF', 'Print-ready', 0], ['CSV', 'Spreadsheets', 0], ['Excel', '.xlsx workbook', 0], ['Plain text', '.txt', 0], ['ZIP', 'Everything plus media', 0]]
      .map(f => ({ name: f[0], note: f[1], cls: f[2] ? 'row on' : 'row' }));
    return { formats };
  }
}
</script>
</body>
</html>
