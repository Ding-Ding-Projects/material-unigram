<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header class="app hbar" style="width: 1440px; height: 64px; padding: 0 16px; gap: 10px; background: var(--ink); color: #fff; font-family: 'Figtree', system-ui, sans-serif">
  <span class="logo" style="width: 34px; height: 34px; border-radius: 12px; margin: 0" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5h16v11H10l-6 4z"/></svg></span>
  <nav aria-label="Workspace tabs" class="hbar" style="gap: 4px; flex: 1 1 auto; min-width: 0; overflow: hidden">
    <span class="chip" style="border-color: transparent; color: var(--ink-mute)">Personal</span>
    <span class="chip" style="background: #fff; color: var(--ink); border-color: #fff">{{section}}</span>
    <span class="chip" style="border-color: transparent; color: var(--ink-mute)">Work</span>
    <span class="chip" style="border-color: rgba(255,255,255,.25); color: #fff; width: 34px; padding: 0; justify-content: center" aria-label="New tab">+</span>
  </nav>
  <label class="hbar" style="background: rgba(255,255,255,.1); border-radius: 12px; height: 40px; padding: 0 12px; width: 280px; gap: 8px"><span class="sr">Search everything</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#93a6b7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input placeholder="Search everything" style="border: 0; background: transparent; color: #fff; font: inherit; outline: none; flex: 1; min-width: 0"><span class="kbd" style="background: transparent; color: var(--ink-mute); border-color: rgba(255,255,255,.25)">Ctrl Shift F</span></label>
  <span class="rx" role="button" aria-label="Regex builder for global search" style="width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--violet); color: #fff">.*</span>
  <span class="seg" role="radiogroup" aria-label="Language" style="border-color: rgba(255,255,255,.25)"><button style="color: var(--ink-mute); height: 34px; padding: 0 10px">EN</button><button style="color: var(--ink-mute); height: 34px; padding: 0 10px; border-left-color: rgba(255,255,255,.25)">粵</button><button class="on" style="background: #fff; color: var(--ink); height: 34px; padding: 0 10px">Both</button></span>
  <span class="chip" role="switch" aria-checked="true" style="background: var(--lime); color: var(--ink); border-color: var(--lime)">Edit look</span>
  <span class="icon-btn" role="button" aria-label="Notifications, 2 new" style="color: #fff; position: relative">&#9679;<span class="badge" style="position: absolute; top: 0; right: -2px">2</span></span>
  <span class="small" style="color: var(--ink-mute); white-space: nowrap">v0.1.0 · 17 Nov 12:40</span>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"section":{"editor":"text","default":"Chats"},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic { renderVals() { return { section: this.props.section ?? 'Chats' }; } }
</script>
</body>
</html>
