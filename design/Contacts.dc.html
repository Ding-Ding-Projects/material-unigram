<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contacts</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; position: relative; background: #e7ecf2">
<dc-import name="TopBar" section="Contacts" hint-size="1440px,64px"></dc-import>
<div class="app" style="width: 1440px; height: 900px; display: flex; gap: 10px; padding: 10px 10px 10px 0">
  <nav class="rail" aria-label="Sections" style="width: 84px; border-radius: 0 24px 24px 0">
    <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H10l-6 4z"/></svg></span>
    <a href="Main.dc.html"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Chats</a>
    <a href="#" class="on"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>Contacts</a>
    <a href="Calls.dc.html"><span class="pill"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span>Calls</a>
  </nav>
  <section class="sheet" aria-label="Contact list" style="width: 420px; display: flex; flex-direction: column; padding: 18px 10px">
    <div class="hbar" style="padding: 0 8px 12px"><h1 class="disp" style="margin: 0; font-size: 30px; flex: 1">Contacts</h1><button class="btn sm tonal">Add contact</button></div>
    <div style="display: flex; gap: 8px; padding: 0 8px"><label class="search" style="flex: 1"><span class="sr">Search contacts</span><input placeholder="Search 214 contacts"></label><button class="rx" aria-label="Regex builder for contact search">.*</button></div>
    <div style="display: flex; gap: 6px; padding: 12px 8px; flex-wrap: wrap"><button class="chip on">A to Z</button><button class="chip">Last seen</button><button class="chip">Select several</button></div>
    <div class="small mute" style="padding: 4px 12px">A</div>
    <sc-for list="{{people}}" as="p" hint-placeholder-count="7">
      <button class="{{p.cls}}"><span class="av" style="{{p.av}}">{{p.ini}}</span><span style="flex: 1"><b style="display: block">{{p.name}}</b><span class="small mute">{{p.seen}}</span></span></button>
    </sc-for>
  </section>
  <main class="sheet" style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 56px 48px; gap: 14px">
    <span class="av" style="width: 120px; height: 120px; border-radius: 40px; background: #c9d7ff; font-size: 40px">AL</span>
    <h2 class="disp" style="margin: 8px 0 0; font-size: 36px">Ada Lin</h2>
    <span class="tag ok">online</span>
    <div class="hbar" style="margin-top: 8px"><a class="btn" href="Main.dc.html">Message</a><button class="btn ghost">Voice call</button><button class="btn ghost">Video call</button></div>
    <div class="sheet2" style="width: 100%; max-width: 560px; margin-top: 20px; padding: 6px 22px">
      <div class="set"><div class="t"><b>Username</b><span class="mute">@ada_example</span></div><button class="icon-btn" aria-label="Copy username">⧉</button></div>
      <div class="set"><div class="t"><b>Phone</b><span class="mute">Hidden by this person's privacy settings</span></div></div>
      <div class="set"><div class="t"><b>Groups in common</b><span class="mute">Design team, Hiking club</span></div></div>
      <div class="set"><div class="t"><b>Notifications</b><span class="mute">On, default sound</span></div><button class="sw on" role="switch" aria-checked="true" aria-label="Notifications for Ada Lin"></button></div>
    </div>
  </main>
</div>
<div style="position: absolute; left: 380px; top: 324px; z-index: 5"><dc-import name="ElementTools" target="Contact: Ada Lin" hint-size="680px,560px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    const pastel = ['#c9d7ff', '#bfeedd', '#ffd5c8', '#e8f6a8', '#e3dcff', '#ffe7a8', '#c9d7ff'];
    const people = [['Ada Lin', 'AL', 'online'], ['Alex Chan', 'AC', 'last seen 10 minutes ago'], ['Amir Rahimi', 'AR', 'last seen yesterday'], ['Ana Souza', 'AS', 'last seen this week'], ['Ari Cohen', 'AC', 'last seen recently'], ['Ava Park', 'AP', 'online'], ['Ayo Bello', 'AB', 'last seen 2 hours ago']]
      .map((p, i) => ({ name: p[0], ini: p[1], seen: p[2], cls: i === 0 ? 'row on' : 'row', av: `width: 44px; height: 44px; background: ${pastel[i]}` }));
    return { people };
  }
}
</script>
</body>
</html>
