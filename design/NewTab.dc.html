<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab catalogue</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; position: relative; background: #e7ecf2">
<dc-import name="TopBar" section="New tab" hint-size="1440px,64px"></dc-import>
<div class="app wall" style="width: 1440px; height: 900px; position: relative; overflow: hidden">
  <div class="scrim" aria-hidden="true"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="nt-h" class="dialog" style="left: 220px; top: 50px; width: 1000px; height: 800px; padding: 30px 32px; display: flex; flex-direction: column; gap: 16px">
    <div class="hbar"><h2 id="nt-h" class="disp" style="margin: 0; font-size: 32px; flex: 1">Open anything in a new tab</h2><button class="btn ghost sm">Open every tab</button><button class="icon-btn" aria-label="Close">&#215;</button></div>
    <div style="display: flex; gap: 8px"><label class="search" style="flex: 1; height: 52px"><span class="sr">Search destinations</span><input placeholder="Search every menu, settings page and tool"></label><button class="rx on" aria-label="Regex builder for destination search" style="height: 52px; width: 52px">.*</button></div>
    <div class="sheet2 mono small" style="padding: 10px 14px; display: flex; gap: 12px; align-items: center"><span style="color: var(--violet)">^(set|tool)</span><span class="mute">flags: i</span><span class="tag ok">Valid · 17 matches</span><span style="flex: 1"></span><span class="mute">mode: filter</span></div>
    <div role="tablist" aria-label="Groups" style="display: flex; gap: 6px; flex-wrap: wrap">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="6"><button role="tab" aria-selected="{{g.on}}" onClick="{{g.pick}}" class="{{g.cls}}">{{g.label}}</button></sc-for>
    </div>
    <div style="flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-content: start">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="15">
        <button class="row" style="border: 1.5px solid var(--line); min-height: 68px"><span class="av" style="{{it.av}}">{{it.ini}}</span><span style="flex: 1; min-width: 0"><b style="display: block">{{it.label}}</b><span class="{{it.stateCls}}">{{it.state}}</span></span></button>
      </sc-for>
    </div>
    <p class="small mute" style="margin: 0">Every page starts open. A tab you close stays closed until you reopen it here or choose Open every tab.</p>
  </section>
</div>
<div style="position: absolute; left: 780px; top: 394px; z-index: 5"><dc-import name="ElementTools" target="Destination: Regex workbench" hint-size="640px,470px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":964}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { grp: 0 }; }
  renderVals() {
    const names = ['All', 'Messenger', 'Settings pages', 'Tools', 'Records', 'Help'];
    const groups = names.map((label, i) => ({ label, on: this.state.grp === i, cls: this.state.grp === i ? 'chip on' : 'chip', pick: () => this.setState({ grp: i }) }));
    const tint = ['', '#bfeedd', '#c9d7ff', '#e8f6a8', '#ffd5c8', '#e3dcff'];
    const all = [['Chats', 1, 1], ['Contacts', 1, 1], ['Calls', 1, 0], ['Language and voice', 2, 1], ['Appearance', 2, 1], ['Animation editor', 2, 0], ['Notifications and sounds', 2, 1], ['Privacy and locks', 2, 1], ['Accounts and devices', 2, 1], ['File converter', 3, 1], ['Regex workbench', 3, 1], ['Virtual disk manager', 3, 0], ['Ollama suite', 3, 1], ['Server manager', 3, 1], ['Drawing', 3, 1], ['Export', 4, 1], ['Version history', 4, 1], ['Changelog', 4, 0], ['Documentation', 5, 1], ['Guided tours', 5, 1], ['Support tickets', 5, 0]];
    const items = all.filter(a => this.state.grp === 0 || a[1] === this.state.grp).map(a => ({ label: a[0], ini: a[0].slice(0, 2), av: `width: 40px; height: 40px; font-size: 13px; background: ${tint[a[1]]}`,
      state: a[2] ? 'Open · selects its tab' : 'Closed · opens a new tab', stateCls: a[2] ? 'small mute' : 'small tag warn' }));
    return { groups, items };
  }
}
</script>
</body>
</html>
