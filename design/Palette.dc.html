<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/eb8c360684d4e055bab1b5ffb359a01e">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1440px; position: relative; background: #e7ecf2">
<dc-import name="TopBar" section="Command palette" hint-size="1440px,64px"></dc-import>
<div class="app wall" style="width: 1440px; height: 900px; position: relative; overflow: hidden">
  <div class="scrim" aria-hidden="true" style="background: rgba(15,26,36,.35)"></div>
  <section role="dialog" aria-label="Command palette" class="dialog" style="left: 40px; top: 50px; width: 760px; padding: 0; overflow: hidden">
    <div style="padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1.5px solid var(--line)">
      <div style="display: flex; gap: 8px">
        <label class="search" style="flex: 1; height: 54px; background: #fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a5a68" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">Search commands, settings, chats and messages</span><input value="dark|night" style="font-size: 18px"><span class="tag vio">Regex</span><span class="kbd">Esc</span></label>
        <button class="rx on" aria-expanded="true" aria-label="Regex builder for the palette" style="width: 54px; height: 54px">.*</button>
      </div>
      <div class="hbar small" style="background: var(--sheet2); border-radius: 12px; padding: 8px 12px; gap: 8px; flex-wrap: wrap">
        <span class="mono" style="color: var(--violet); font-weight: 700">dark|night</span><span class="mute">either word</span>
        <span class="chip on" style="height: 28px">i</span><span class="chip" style="height: 28px">whole word</span>
        <span class="seg"><button class="on" style="height: 28px">Commands</button><button style="height: 28px">Settings</button><button style="height: 28px">Chats</button><button style="height: 28px">All</button></span>
        <span style="flex: 1"></span><span class="tag ok">Valid · 6 results · 0.3 ms</span><a href="Workbench.dc.html" class="small">Full builder</a>
      </div>
    </div>
    <div style="padding: 8px 10px; max-height: 600px; overflow: auto">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div class="small mute" style="padding: 10px 12px 4px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase">{{g.title}}</div>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <div class="{{it.cls}}" role="option" aria-selected="{{it.on}}" style="gap: 10px">
            <span class="av" style="{{it.av}}">{{it.ini}}</span>
            <span style="flex: 1; min-width: 0"><b style="display: block">{{it.label}}</b><span class="small mute">{{it.hint}}</span></span>
            <sc-if value="{{it.isSwitch}}" hint-placeholder-val="{{false}}"><span role="switch" aria-checked="{{it.state}}" aria-label="{{it.label}}" class="{{it.swCls}}" style="width: 44px; height: 26px"></span></sc-if>
            <sc-if value="{{it.hasLive}}" hint-placeholder-val="{{false}}"><span class="{{it.liveCls}}">{{it.live}}</span></sc-if>
            <span class="kbd">{{it.key}}</span>
          </div>
          <sc-if value="{{it.on}}" hint-placeholder-val="{{false}}">
            <div aria-label="Live preview" class="hbar" style="margin: 2px 10px 8px 58px; gap: 10px">
              <span class="small mute">Live preview</span>
              <span style="width: 120px; height: 64px; border-radius: 12px; background: #e7ecf2; border: 1.5px solid var(--line); display: flex; padding: 6px; gap: 4px"><span style="width: 14px; background: #0f1a24; border-radius: 4px"></span><span style="flex: 1; background: #fff; border-radius: 6px"></span></span>
              <span class="mute">&#8594;</span>
              <span style="width: 120px; height: 64px; border-radius: 12px; background: #0f1a24; border: 2px solid var(--lime); display: flex; padding: 6px; gap: 4px"><span style="width: 14px; background: #d4f36b; border-radius: 4px"></span><span style="flex: 1; background: #1c2a37; border-radius: 6px"></span></span>
              <span class="small mute">Enter to apply · Esc to keep Light</span>
            </div>
          </sc-if>
        </sc-for>
      </sc-for>
    </div>
    <div class="hbar small mute" style="padding: 12px 20px; border-top: 1.5px solid var(--line); background: var(--sheet2)"><span class="kbd">&#8593; &#8595;</span> move <span class="kbd">Enter</span> run <span class="kbd">Space</span> toggle <span class="kbd">Ctrl Enter</span> new tab <span style="flex: 1"></span>412 commands, every setting, your chats</div>
</div>
<div style="position: absolute; left: 740px; top: 384px; z-index: 5"><dc-import name="ElementTools" target="Result: Dark theme at sunset" hint-size="680px,560px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":964}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (label, hint, key, tint, o) => ({ label, hint, key, ini: label.slice(0, 1), on: !!o.on, isSwitch: o.sw !== undefined, state: !!o.sw, swCls: o.sw ? 'sw on' : 'sw', hasLive: !!o.live, live: o.live || '', liveCls: o.liveCls || 'tag',
      cls: o.on ? 'row on' : 'row', av: `width: 36px; height: 36px; font-size: 14px; border-radius: 12px; background: ${tint}` });
    const groups = [
      { title: 'Commands', items: [mk('Dark theme', 'Appearance · currently Light', 'Ctrl Shift D', '#0f1a24;color:#d4f36b', { on: 1, sw: false }), mk('Dark theme at sunset', 'Schedule · runs at 17:42 today', '', '#e8f6a8', { sw: true }), mk('Night mode for notifications', 'Quiet hours 22:00 to 07:00', '', '#e8f6a8', { live: 'On now', liveCls: 'tag ok' })] },
      { title: 'Settings', items: [mk('Darken chat wallpaper at night', 'Settings > Chats and media', '', '#c9d7ff', { sw: false }), mk('Wallpaper darkness', 'Settings > Appearance', '', '#c9d7ff', { live: '40%' })] },
      { title: 'Messages', items: [mk('"the dark mode boards look great"', 'Design team · Tue 10:12', 'Enter', '#bfeedd', { live: '1 of 3 matches' })] }
    ];
    return { groups };
  }
}
</script>
</body>
</html>
